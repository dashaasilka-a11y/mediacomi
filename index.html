<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#26CD94" />
    <meta name="description" content="Медиакоми — симулятор угадывания цен на квартиры. Проверьте, насколько хорошо вы чувствуете рынок недвижимости!" />
    
    <!-- Security Headers via meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' https://*.img.avito.st data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self';" />
    
    <title>Медиакоми — Угадай цену квартиры</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030712;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      /* Custom range slider styles */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: #374151;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #26CD94;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(38, 205, 148, 0.4);
        transition: transform 0.15s ease;
      }
      input[type="range"]::-webkit-slider-thumb:active {
        transform: scale(1.2);
      }
      input[type="range"]::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #26CD94;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 8px rgba(38, 205, 148, 0.4);
      }
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
